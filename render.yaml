services:
  - type: web
    name: eclesiar-chatgpt-proxy
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ECLESIAR_API_KEY
        sync: false
      - key: PROXY_ACCESS_TOKEN
        sync: false
